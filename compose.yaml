services:
  journal:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SITE_URL: ${SITE_URL:?Set the actual HTTPS origin in SITE_URL}
      DATABASE_URL: ${DATABASE_URL:?Set the Neon connection string in DATABASE_URL}
      BACKUP_DIR: /app/backups
    volumes:
      - journal-backups:/app/backups
volumes:
  journal-backups:
